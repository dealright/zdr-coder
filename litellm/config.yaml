# LiteLLM routes. Each profile points at its pod's RunPod HTTPS proxy.
# Proxy URLs + per-profile bearer tokens are populated by scripts/deploy.sh into
# .env-runtime, which docker-compose loads. Undeployed profiles return 502 (env
# vars unset → unreachable target) — that's expected.
#
# The `model:` field must match what vLLM serves under (its HF id, since
# start.sh doesn't pass --served-model-name). Keep these in sync with the
# MODEL defaults in scripts/deploy.sh.

model_list:
  - model_name: haiku
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
      api_base: os.environ/HAIKU_API_BASE
      api_key: os.environ/HAIKU_API_KEY

  # Same model as `haiku` but served by RunPod Serverless instead of a pod —
  # billed per-second, scales to zero when idle, cold-starts on first request.
  # Provisioned by scripts/deploy-serverless.sh haiku.
  - model_name: haiku-serverless
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
      api_base: os.environ/HAIKU_SERVERLESS_API_BASE
      api_key: os.environ/HAIKU_SERVERLESS_API_KEY

  # DeepSeek V4 Flash on RunPod Serverless — 4× H100 80GB per worker, scales
  # to zero. Cold start is ~5-10 min on first request (149 GiB FP8 download).
  # Provisioned by scripts/deploy-serverless.sh sonnet.
  - model_name: sonnet-serverless
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4-Flash
      api_base: os.environ/SONNET_SERVERLESS_API_BASE
      api_key: os.environ/SONNET_SERVERLESS_API_KEY

  # Same models as haiku/sonnet/opus but served on Vast.ai (marketplace of
  # datacenter + consumer GPUs). Significantly cheaper than RunPod across all
  # tiers and far more on-demand capacity. Provisioned by deploy-vast.sh.
  # NOTE: Vast direct-port-forwarding is plain HTTP; the bearer token is the
  # only thing keeping the endpoint private. See README "Caveats".
  - model_name: haiku-vast
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
      api_base: os.environ/HAIKU_VAST_API_BASE
      api_key: os.environ/HAIKU_VAST_API_KEY

  - model_name: sonnet-vast
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4-Flash
      api_base: os.environ/SONNET_VAST_API_BASE
      api_key: os.environ/SONNET_VAST_API_KEY

  - model_name: opus-vast
    litellm_params:
      model: openai/moonshotai/Kimi-K2.6
      api_base: os.environ/OPUS_VAST_API_BASE
      api_key: os.environ/OPUS_VAST_API_KEY

  - model_name: sonnet
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4-Flash
      api_base: os.environ/SONNET_API_BASE
      api_key: os.environ/SONNET_API_KEY

  - model_name: opus
    litellm_params:
      model: openai/moonshotai/Kimi-K2.6
      api_base: os.environ/OPUS_API_BASE
      api_key: os.environ/OPUS_API_KEY

  # ── API mode (ZDR via provider policy, scale-to-zero by definition) ──
  # Groq Cloud — SOC 2 Type 2, ISO 27001, HIPAA BAA; ZDR is a self-serve
  # toggle in console (Data Controls). LPU inference at 300+ tok/s. No api_base
  # needed — LiteLLM has native Groq routing.
  #
  # GPT-OSS (OpenAI's open-weight reasoning models, released Aug 2025) is
  # tool-use + coding tuned and ~3× cheaper than Llama 3.3 70B. As of May 2026
  # it's the right pick for both tiers on Groq. See README "Honest tier mapping".
  # NOTE: slug is `groq/gpt-oss-120b` not `groq/openai/gpt-oss-120b` —
  # LiteLLM's provider parser breaks on the second slash and falls back to
  # OpenAI direct (404). See https://github.com/BerriAI/litellm/issues/14807
  - model_name: haiku-api
    litellm_params:
      model: groq/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  - model_name: sonnet-api
    litellm_params:
      model: groq/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  # Back-compat aliases: heavy/plan → sonnet
  - model_name: heavy
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4-Flash
      api_base: os.environ/SONNET_API_BASE
      api_key: os.environ/SONNET_API_KEY

  - model_name: plan
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4-Flash
      api_base: os.environ/SONNET_API_BASE
      api_key: os.environ/SONNET_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
