# LiteLLM routes. Three Claude-style tiers, each peered with its own GPU pod
# over a dedicated WireGuard subnet:
#   haiku  → 10.99.10.2  (Qwen3-Coder-32B on 1× RTX A5000)
#   sonnet → 10.99.20.2  (DeepSeek V4 Flash on 2× A100 SXM)
#   opus   → 10.99.30.2  (Kimi K2.6 on 8× H100 SXM)
# Aliases work even if only one profile is deployed; routes to undeployed peers
# return 502 (no peer reachable).

model_list:
  - model_name: haiku
    litellm_params:
      model: openai/inference
      api_base: http://10.99.10.2:8000/v1
      api_key: not-used-but-required

  - model_name: sonnet
    litellm_params:
      model: openai/inference
      api_base: http://10.99.20.2:8000/v1
      api_key: not-used-but-required

  - model_name: opus
    litellm_params:
      model: openai/inference
      api_base: http://10.99.30.2:8000/v1
      api_key: not-used-but-required

  # Aliases for back-compat. Default `heavy` and `plan` route to sonnet.
  - model_name: heavy
    litellm_params:
      model: openai/inference
      api_base: http://10.99.20.2:8000/v1
      api_key: not-used-but-required

  - model_name: plan
    litellm_params:
      model: openai/inference
      api_base: http://10.99.20.2:8000/v1
      api_key: not-used-but-required

litellm_settings:
  drop_params: true
  set_verbose: false
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
