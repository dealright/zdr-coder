# LiteLLM routes. The GPU peer is at the hardcoded WireGuard subnet IP 10.99.0.2.

model_list:
  - model_name: heavy
    litellm_params:
      model: openai/inference
      api_base: http://10.99.0.2:8000/v1
      api_key: not-used-but-required

  - model_name: plan
    litellm_params:
      model: openai/inference
      api_base: http://10.99.0.2:8000/v1
      api_key: not-used-but-required

  - model_name: haiku
    litellm_params:
      model: openai/inference
      api_base: http://10.99.0.2:8000/v1
      api_key: not-used-but-required

  - model_name: sonnet
    litellm_params:
      model: openai/inference
      api_base: http://10.99.0.2:8000/v1
      api_key: not-used-but-required

  - model_name: opus
    litellm_params:
      model: openai/inference
      api_base: http://10.99.0.2:8000/v1
      api_key: not-used-but-required

litellm_settings:
  drop_params: true
  set_verbose: false
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
