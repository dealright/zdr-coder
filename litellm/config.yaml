# LiteLLM routes. Each profile points at its pod's RunPod HTTPS proxy.
# Proxy URLs + per-profile bearer tokens are populated by scripts/deploy.sh into
# .env-runtime, which docker-compose loads. Undeployed profiles return 502 (env
# vars unset → unreachable target) — that's expected.

model_list:
  - model_name: haiku
    litellm_params:
      model: openai/inference
      api_base: os.environ/HAIKU_API_BASE
      api_key: os.environ/HAIKU_API_KEY

  - model_name: sonnet
    litellm_params:
      model: openai/inference
      api_base: os.environ/SONNET_API_BASE
      api_key: os.environ/SONNET_API_KEY

  - model_name: opus
    litellm_params:
      model: openai/inference
      api_base: os.environ/OPUS_API_BASE
      api_key: os.environ/OPUS_API_KEY

  # Back-compat aliases: heavy/plan → sonnet
  - model_name: heavy
    litellm_params:
      model: openai/inference
      api_base: os.environ/SONNET_API_BASE
      api_key: os.environ/SONNET_API_KEY

  - model_name: plan
    litellm_params:
      model: openai/inference
      api_base: os.environ/SONNET_API_BASE
      api_key: os.environ/SONNET_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
