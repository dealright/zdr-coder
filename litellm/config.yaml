# LiteLLM routes. Each profile points at its pod's RunPod HTTPS proxy.
# Proxy URLs + per-profile bearer tokens are populated by scripts/deploy.sh into
# .env-runtime, which docker-compose loads. Undeployed profiles return 502 (env
# vars unset → unreachable target) — that's expected.
#
# The `model:` field below uses tier aliases (haiku-pod, sonnet-pod, etc.)
# because sky/*.yaml now pass --served-model-name on the vllm command, decoupling
# our route names from the underlying HF id. Current HF ids per tier:
#   haiku-pod  → Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
#   sonnet-pod → zai-org/GLM-4.5-Air
#   opus-pod   → deepseek-ai/DeepSeek-V4-Pro
# Update sky/*.yaml to swap models without touching this file.

model_list:
  # ── SkyPilot-launched self-hosted pods (live endpoints) ──
  # Endpoints are filled by ./scripts/sky-up.sh after `sky launch` completes;
  # IP/port changes every time you tear down and relaunch the cluster.
  # Run this to refresh manually if needed:
  #   echo "HAIKU_POD_API_BASE=http://$(sky status --endpoint 8080 haiku-pod)/v1" >> .env-runtime
  #
  # vLLM has no auth by default — api_key is a dummy placeholder so LiteLLM
  # is satisfied; the actual access control is the bearer token between Cline
  # and LiteLLM (`.litellm-key`).
  - model_name: haiku-pod
    litellm_params:
      model: openai/haiku-pod
      api_base: os.environ/HAIKU_POD_API_BASE
      api_key: dummy

  - model_name: sonnet-pod
    litellm_params:
      model: openai/sonnet-pod
      api_base: os.environ/SONNET_POD_API_BASE
      api_key: dummy

  - model_name: opus-pod
    litellm_params:
      model: openai/opus-pod
      api_base: os.environ/OPUS_POD_API_BASE
      api_key: dummy

  # opus-h100: Qwen3-Coder-480B-A35B-FP8 self-hosted on 8× H100 (sky/opus-h100.yaml).
  # The opus-class route that FITS ON H100 — unlike opus-pod's V4-Pro (8× H200 only).
  # Deep-research winner for agentic tool-use; dedicated qwen3_coder parser, stable
  # vLLM v0.10.0+ (no nightly). Launched by sky launch ... --infra runpod, then
  # ./scripts/api-up.sh refreshes OPUS_H100_API_BASE.
  - model_name: opus-h100
    litellm_params:
      model: openai/opus-h100
      api_base: os.environ/OPUS_H100_API_BASE
      api_key: dummy

  - model_name: haiku-serve
    litellm_params:
      model: openai/haiku-serve
      api_base: os.environ/HAIKU_SERVE_API_BASE
      api_key: dummy

  - model_name: sonnet-serve
    litellm_params:
      model: openai/sonnet-serve
      api_base: os.environ/SONNET_SERVE_API_BASE
      api_key: dummy

  - model_name: opus-serve
    litellm_params:
      model: openai/opus-serve
      api_base: os.environ/OPUS_SERVE_API_BASE
      api_key: dummy

  - model_name: haiku
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
      api_base: os.environ/HAIKU_API_BASE
      api_key: os.environ/HAIKU_API_KEY

  # Same model as `haiku` but served by RunPod Serverless instead of a pod —
  # billed per-second, scales to zero when idle, cold-starts on first request.
  # Provisioned by scripts/deploy-serverless.sh haiku.
  - model_name: haiku-serverless
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
      api_base: os.environ/HAIKU_SERVERLESS_API_BASE
      api_key: os.environ/HAIKU_SERVERLESS_API_KEY

  # Qwen2.5-72B-Instruct-AWQ on RunPod Serverless — single A100/H200 (80-141GB),
  # scales to zero. Cold start ~3-5 min on first request (36 GiB AWQ download).
  # Single-GPU avoids multi-GPU serverless provisioning failures. Restricted to
  # 80 GB+ GPUs so 72B AWQ leaves ~36 GB for KV cache (16K context comfortable).
  # Provisioned by scripts/deploy-serverless.sh sonnet.
  - model_name: sonnet-serverless
    litellm_params:
      model: openai/Qwen/Qwen2.5-72B-Instruct-AWQ
      api_base: os.environ/SONNET_SERVERLESS_API_BASE
      api_key: os.environ/SONNET_SERVERLESS_API_KEY

  # Same models as haiku/sonnet/opus but served on Vast.ai (marketplace of
  # datacenter + consumer GPUs). Significantly cheaper than RunPod across all
  # tiers and far more on-demand capacity. Provisioned by deploy-vast.sh.
  # NOTE: Vast direct-port-forwarding is plain HTTP; the bearer token is the
  # only thing keeping the endpoint private. See README "Caveats".
  - model_name: haiku-vast
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
      api_base: os.environ/HAIKU_VAST_API_BASE
      api_key: os.environ/HAIKU_VAST_API_KEY

  - model_name: sonnet-vast
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4-Flash
      api_base: os.environ/SONNET_VAST_API_BASE
      api_key: os.environ/SONNET_VAST_API_KEY

  - model_name: opus-vast
    litellm_params:
      model: openai/moonshotai/Kimi-K2.6
      api_base: os.environ/OPUS_VAST_API_BASE
      api_key: os.environ/OPUS_VAST_API_KEY

  - model_name: sonnet
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4-Flash
      api_base: os.environ/SONNET_API_BASE
      api_key: os.environ/SONNET_API_KEY

  - model_name: opus
    litellm_params:
      model: openai/moonshotai/Kimi-K2.6
      api_base: os.environ/OPUS_API_BASE
      api_key: os.environ/OPUS_API_KEY

  # ── API mode (ZDR via provider policy, scale-to-zero by definition) ──
  # Groq Cloud — SOC 2 Type 2, ISO 27001, HIPAA BAA; ZDR is a self-serve
  # toggle in console (Data Controls). LPU inference at 300+ tok/s. No api_base
  # needed — LiteLLM has native Groq routing.
  #
  # GPT-OSS (OpenAI's open-weight reasoning models, released Aug 2025) is
  # tool-use + coding tuned and ~3× cheaper than Llama 3.3 70B. As of May 2026
  # it's the right pick for both tiers on Groq. See README "Honest tier mapping".
  # Groq exposes GPT-OSS under `openai/gpt-oss-Nb` (the "openai/" is part of
  # Groq's model name, not a LiteLLM provider prefix). LiteLLM's native Groq
  # integration forwards everything after `groq/` to Groq's API, so the
  # correct slug is `groq/openai/gpt-oss-Nb`. Verify with:
  #   curl https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY"
  - model_name: haiku-api
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  - model_name: sonnet-api
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  # ── Agentic routes for tool-calling clients (Hermes, Cline) ───────────
  # PRIMARY = AWS Bedrock w/ Qwen3-Coder. Why this swap (June 2026):
  #   Groq's server-side tool-call validator rejects ANY malformed call
  #   with `tool_use_failed`, which LiteLLM's int-parse trips on (HTTP 500).
  #   Even Llama 4 Scout occasionally malforms in multi-turn under heavy
  #   tool registration (Hermes auto-loads ~28 toolsets). Bedrock doesn't
  #   do server-side tool-name validation, so model output round-trips
  #   cleanly. Same model (Qwen3-Coder-30B-A3B) we'd otherwise self-host
  #   on haiku-pod — now as managed API, scale-to-zero, $0 idle.
  #   AWS BAA covers it (user already signed). ~172ms first-token latency.
  # haiku-llama: Qwen3-Coder 30B/3B-active on Bedrock. Cheap and fast.
  # CAVEAT: Bedrock's Converse API doesn't natively parse Qwen3-Coder's
  # `<function=name>...</function>` XML tool-call format, so multi-turn
  # agentic loops may need tool_repair.py's XML parser (TODO). For now,
  # use this for SINGLE-turn coding tasks. Use sonnet-llama for multi-turn.
  - model_name: haiku-llama
    litellm_params:
      model: bedrock/converse/qwen.qwen3-coder-30b-a3b-v1:0
      aws_region_name: us-east-1

  # sonnet-llama: DeepSeek V3.2 on Bedrock. The deep-research workflow's
  # specific recommendation for agentic-sonnet. Clean tool_calls[] in both
  # streaming and non-streaming, ZDR default-on, BAA covered, ~$3-8/M
  # tokens (vs Mistral Large 3 at ~$3-15/M). The previous Mistral Large 3
  # route is still available as `opus-bedrock` for opus-class needs.
  - model_name: sonnet-llama
    litellm_params:
      model: bedrock/converse/deepseek.v3.2
      aws_region_name: us-east-1

  # ── Bedrock catalog — additional routes for specific use cases ────────
  # Qwen3-VL 235B for vision (Claude vision replacement on Bedrock)
  - model_name: vision-bedrock
    litellm_params:
      model: bedrock/converse/qwen.qwen3-vl-235b-a22b
      # Creds come from ~/.aws/credentials (mounted into the container by
      # docker-compose.yml at /root/.aws). boto3 default credential chain
      # discovers them automatically.
      aws_region_name: us-east-1

  # Mistral Large 3 675B — opus-class managed (vs self-hosting V4-Pro on 8xH200)
  - model_name: opus-bedrock
    litellm_params:
      model: bedrock/converse/mistral.mistral-large-3-675b-instruct
      # Creds come from ~/.aws/credentials (mounted into the container by
      # docker-compose.yml at /root/.aws). boto3 default credential chain
      # discovers them automatically.
      aws_region_name: us-east-1

  # sonnet-glm: Z.AI GLM 4.7 Flash on Bedrock. Lightweight, cost-efficient
  # GLM family option marketed by AWS as "purpose-built for production
  # deployment." HIPAA BAA covered, ZDR default-on. GLM 5 (the full 744B/40B
  # variant) is also active on Bedrock — use `opus-glm` below for that tier.
  # NOTE: GLM 5.2 (released June 13, 2026) is NOT YET on Bedrock; check back
  # in 1-3 weeks for the typical add cadence.
  - model_name: sonnet-glm
    litellm_params:
      model: bedrock/converse/zai.glm-4.7-flash
      aws_region_name: us-east-1

  # opus-glm: Z.AI GLM 5 (the full predecessor to 5.2) on Bedrock. opus-class
  # MoE (744B total / 40B active per token), HIPAA-covered, ZDR default-on.
  - model_name: opus-glm
    litellm_params:
      model: bedrock/converse/zai.glm-5
      aws_region_name: us-east-1

  # opus-claude: Genuine Claude Opus via Bedrock. Under YOUR AWS BAA,
  # ZDR default-on, NOT under Anthropic's consumer terms. Use this for the
  # gnarly ~5% of tasks where genuine Opus-class reasoning matters.
  # Most expensive route in the stack (~$15/M in, ~$75/M out, similar to
  # Anthropic list price). Don't default to this — reach for it.
  #
  # Currently pointing at Opus 4.6 because that's the newest version this
  # account already has model-access for. To upgrade to 4.7 or 4.8 (the
  # latest as of June 2026):
  # 1. Open Bedrock console → Model access
  #    https://us-east-1.console.aws.amazon.com/bedrock/home#/modelaccess
  # 2. Modify model access → check Opus 4.8 → Submit (instant for established
  #    accounts; ~30-60 min cold start for first-time requests)
  # 3. Change the model line below to us.anthropic.claude-opus-4-8
  # 4. docker compose up -d --force-recreate litellm
  - model_name: opus-claude
    litellm_params:
      model: bedrock/converse/us.anthropic.claude-opus-4-6-v1
      aws_region_name: us-east-1

  # ── OPTIONAL: direct Z.ai API for GLM 5.2 (NOT HIPAA-COMPATIBLE) ──────
  # GLM 5.2 (released June 13, 2026) is Z.ai's flagship: 744B/40B MoE,
  # 1M token context, MIT license. As of June 15 2026 it's accessible only
  # via Z.ai's direct API (Coding Plan subscribers; public pay-per-token API
  # arrives ~June 20 2026). Bedrock typically adds new Z.AI models 1-3
  # weeks after release.
  #
  # ⚠️  IMPORTANT: Z.ai's direct API routes traffic through Z.ai's
  # infrastructure in CHINA. This is INCOMPATIBLE with HIPAA workloads
  # involving US healthcare data, and may conflict with other
  # data-residency requirements. Use ONLY for non-sensitive experiments.
  #
  # Activated only when Z_AI_API_KEY is set in .env. Without the key, the
  # route returns 401 (silent, expected). To activate:
  #   1. Register/login at https://z.ai/model-api (Z.ai Open Platform)
  #   2. Subscribe to GLM Coding Plan ($10-80/mo) for GLM 5.2 access today,
  #      OR wait for the public pay-per-token API (~June 20 2026)
  #   3. Generate a key at https://z.ai/manage-apikey/apikey-list
  #   4. Add `Z_AI_API_KEY=...` to .env
  #   5. docker compose up -d --force-recreate litellm
  - model_name: sonnet-glm-zai
    litellm_params:
      model: openai/glm-5.2
      api_base: https://api.z.ai/api/paas/v4
      api_key: os.environ/Z_AI_API_KEY

  # DeepSeek V3.2 on Bedrock — same family as our self-host sonnet/opus picks
  - model_name: sonnet-deepseek-bedrock
    litellm_params:
      model: bedrock/converse/deepseek.v3.2
      # Creds come from ~/.aws/credentials (mounted into the container by
      # docker-compose.yml at /root/.aws). boto3 default credential chain
      # discovers them automatically.
      aws_region_name: us-east-1

  # ── Groq Llama as fallback (kept for cost-sensitive single-turn use) ──
  # These were the prior sonnet-llama / haiku-llama. They DO work for
  # single-turn or low-tool-count agentic loops where Groq's strict
  # validation doesn't trip. Cheaper than Bedrock; ~10x faster TTFT.
  - model_name: haiku-llama-groq
    litellm_params:
      model: groq/qwen/qwen3-32b
      api_key: os.environ/GROQ_API_KEY

  - model_name: sonnet-llama-groq
    litellm_params:
      model: groq/meta-llama/llama-4-scout-17b-16e-instruct
      api_key: os.environ/GROQ_API_KEY

  # Note: there is no `opus-api` route. Groq's production catalog tops out at
  # GPT-OSS 120B (Sonnet-class). For Opus-class via API you'd need a second
  # provider (Fireworks, DeepInfra, etc.) — we deliberately keep this to a
  # single API key to minimize non-developer setup friction. Use `opus-vast`
  # (self-hosted Kimi K2.6) when you need Opus-class.

  # Back-compat aliases: heavy/plan → sonnet
  - model_name: heavy
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4-Flash
      api_base: os.environ/SONNET_API_BASE
      api_key: os.environ/SONNET_API_KEY

  - model_name: plan
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4-Flash
      api_base: os.environ/SONNET_API_BASE
      api_key: os.environ/SONNET_API_KEY

litellm_settings:
  drop_params: true
  # ZDR/PRODUCTION MODE: prompt + response content must NOT hit local logs —
  # your own logs are in-scope for ZDR/HIPAA. Verbose off + message logging off.
  # (Was DEBUG MODE for a past Groq tool-call investigation; flipped 2026-06-21.)
  set_verbose: false
  turn_off_message_logging: true
  json_logs: false
  # Tool-call repair callback — see litellm/tool_repair.py. Fixes Groq's
  # `tool_use_failed` int-parse crash AND rewrites raw-text tool calls
  # into proper tool_calls[] arrays before they reach the client.
  callbacks: tool_repair.tool_repair_handler

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
