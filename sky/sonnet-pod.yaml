# zdr-coder — Sonnet-tier always-on inference pod
# Qwen3-235B-A22B-Instruct (BF16, 22B active / 235B total MoE, ~470 GB BF16)
# Cost: ~$22/hr on Lambda 8× A100-80GB
#
# Why this model (after several failed attempts):
#   ✗ GLM-4.5-Air + glm4_moe parser: vLLM v0.10.0 has a streaming + tool_choice=auto
#     bug where the model acknowledges tools but never commits to tool_calls.
#     vLLM v0.22+ has a fixed glm45 parser but needs CUDA 12.9 which Lambda
#     doesn't support.
#   ✗ Qwen3-Coder-480B-A35B-Instruct-FP8: requires Hopper (H100/H200) for the
#     FP8 CutlassBlockScaledGroupedGemm kernel; A100 can't run it. And H100:8
#     capacity has been dry across Lambda/Vast/RunPod for 10+ hours.
#   ✓ Qwen3-235B-A22B-Instruct (BF16): smaller MoE that fits A100-80GB cleanly,
#     same Qwen3 family as the proven haiku-pod, inherits the PROVEN-WORKING
#     qwen3_coder parser path. 22B active params = fast MoE inference.
#     Apache 2.0 license. Workflow research rated it sonnet-class.
#
# Usage:
#   sky launch -c sonnet-pod sky/sonnet-pod.yaml
#   sky status
#   sky down sonnet-pod

name: sonnet-pod

resources:
  # Qwen3-235B-A22B BF16 is ~470 GB on disk. 8× A100-80GB (640 GB VRAM) fits
  # cleanly with ~170 GB headroom for KV cache + activations.
  # H100/H200 also work if capacity is available (just more expensive).
  accelerators: {A100-80GB:8, H100:8, H200:8}
  any_of:
    - cloud: lambda
    - cloud: vast
    - cloud: runpod

  # vLLM v0.10.0 has the qwen3_coder parser we proved working on haiku-pod.
  image_id: docker:vllm/vllm-openai:v0.10.0

  disk_size: 600   # GB — Qwen3-235B-A22B BF16 ~470 GB on disk + base image
  ports: 8080

setup: |
  set -e
  mkdir -p ~/cache

run: |
  # tensor-parallel-size auto-detected from $SKYPILOT_NUM_GPUS_PER_NODE
  # --tool-call-parser qwen3_coder: PROVEN working on haiku-pod for
  # streaming + tool_choice=auto + multi-turn tool calls.
  python3 -m vllm.entrypoints.openai.api_server \
    --model Qwen/Qwen3-235B-A22B-Instruct-2507 \
    --download-dir ~/cache \
    --host 0.0.0.0 --port 8080 \
    --tensor-parallel-size $SKYPILOT_NUM_GPUS_PER_NODE \
    --max-model-len 131072 \
    --gpu-memory-utilization 0.92 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --trust-remote-code \
    --served-model-name sonnet-pod
