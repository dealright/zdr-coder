# zdr-coder — Opus-tier always-on inference pod
# DeepSeek-V4-Pro (1.6T total / 49B active MoE, FP4+FP8 mixed precision)
# Cost: $28–$32/hr on 8× H200 (RunPod Secure); ~$22-30/hr on Vast/Verda/Nebius
#
# Why this model: Released April 24, 2026. MIT license, 1M context. Crucially,
# tool calling is "good" vs the prior Kimi K2.6 pick's "mediocre" (BFCL ~64.5%)
# — and agentic coding is the whole point of an opus-tier model. Natively
# designed for FP4+FP8 mixed precision targeting 8× H200's 1128 GB VRAM bucket.
#
# Usage:
#   sky launch -c opus-pod sky/opus-pod.yaml
#   sky status
#   sky down opus-pod

name: opus-pod

resources:
  # 8× H200 ONLY — V4-Pro needs the 1128 GB bucket. FP4+FP8 mix is ~800 GB
  # weights + KV cache for 1M context. 4× H200 (564 GB) and 8× H100 (640 GB)
  # both OOM.
  # NOTE: deepseek_v3 tool-call parser requires vLLM ~v0.10.x. If v0.10.0
  # pinned image lacks it, bump to v0.10.2+ (verify Lambda driver supports it).
  image_id: docker:vllm/vllm-openai:v0.10.0
  # Backend failover pool. RunPod uses H200-SXM naming ($35.12/hr).
  # Vast: cheapest 8× H200 (~$20.71/hr France) — but offers often stale.
  # AWS p5e/p5en 48xl (~$63 OD) — frequently capacity-constrained.
  any_of:
    # Vast first: cheapest 8× H200 (~$20.71/hr); offer-bid race common.
    - cloud: vast
      accelerators: H200:8
    # RunPod fallback ($35.12/hr) — H200 SXM allocation has been getting stuck
    # in "rented but never starts" state, so kept but deprioritised.
    - cloud: runpod
      accelerators: H200-SXM:8
    # AWS p5e/p5en 48xl (~$63/hr) — frequently capacity-constrained but a
    # legitimate fallback for compliance critical loads.
    - cloud: aws
      accelerators: H200:8

  disk_size: 1500   # GB — DeepSeek-V4-Pro FP4+FP8 weights are ~800 GB
  ports: 8080

setup: |
  mkdir -p ~/cache

run: |
  # tensor-parallel-size auto-detected from num GPUs by vLLM.
  # --tool-call-parser deepseek_v3: converts DeepSeek-V3.1+/V4 tool-call
  # output into OpenAI tool_calls[]. V4-Pro uses the same parser family.
  python3 -m vllm.entrypoints.openai.api_server \
    --model deepseek-ai/DeepSeek-V4-Pro \
    --download-dir ~/cache \
    --host 0.0.0.0 --port 8080 \
    --tensor-parallel-size $SKYPILOT_NUM_GPUS_PER_NODE \
    --max-model-len 131072 \
    --gpu-memory-utilization 0.90 \
    --enable-auto-tool-choice \
    --tool-call-parser deepseek_v3 \
    --trust-remote-code \
    --served-model-name opus-pod
