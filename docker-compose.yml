# zdr-coder local stack — just LiteLLM. No mesh VPN; the GPU pod is reached via
# RunPod's HTTPS proxy at https://[POD_ID]-8000.proxy.runpod.net (auth via
# bearer token set per-profile in .env-runtime).

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: zdr-litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    # Both per-profile API_BASE/_KEY vars AND LITELLM_MASTER_KEY come from
    # .env-runtime, written by the deploy scripts. This makes container
    # recreates (force-recreate after add/remove profile) self-sufficient —
    # no need to remember `export LITELLM_MASTER_KEY` in every caller.
    env_file:
      - .env-runtime
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
      - --host
      - "0.0.0.0"
