# zdr-coder local stack: WireGuard peer + LiteLLM. No control plane, no third party.
#   wg-laptop  → WireGuard interface that peers directly with the GPU pod
#   litellm    → OpenAI-compatible proxy, exposed only on 127.0.0.1:4000

services:
  wg-laptop:
    image: linuxserver/wireguard:latest
    container_name: zdr-wg
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./wg/laptop.conf:/config/wg_confs/wg0.conf:ro
    ports:
      - "127.0.0.1:4000:4000"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: zdr-litellm
    restart: unless-stopped
    network_mode: service:wg-laptop
    depends_on: [wg-laptop]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
      - --host
      - "0.0.0.0"
