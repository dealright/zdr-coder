# zdr-coder local stack — just LiteLLM. No mesh VPN; the GPU pod is reached via
# RunPod's HTTPS proxy at https://[POD_ID]-8000.proxy.runpod.net (auth via
# bearer token set per-profile in .env-runtime).

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: zdr-litellm
    restart: unless-stopped
    # Bind both IPv4 and IPv6 loopback. Docker only forwards the interface(s)
    # you list — `127.0.0.1:4000:4000` alone leaves IPv6 ::1 unbound. Node.js
    # 18+ (the runtime Cline uses) often resolves `localhost` to IPv6 first,
    # so a single-stack v4 binding causes "Connection error" from Cline even
    # though curl works fine.
    ports:
      - "127.0.0.1:4000:4000"
      - "[::1]:4000:4000"
      # To also expose on the Tailscale interface (e.g. so a remote VSCodium
      # Cline host on the tailnet can reach this proxy without an SSH tunnel),
      # use docker-compose.tailscale.yml as an override:
      #   TAILSCALE_IP=100.x.y.z docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
    # Per-profile API_BASE/_KEY vars + LITELLM_MASTER_KEY come from .env-runtime
    # (written by deploy scripts). Provider API keys like GROQ_API_KEY come
    # from .env directly (no deploy step — keys persist for the lifetime of
    # the account). Compose merges both; .env-runtime wins on conflict.
    env_file:
      - path: .env
        required: false
      - path: .env-runtime
        required: false
    environment:
      # ZDR: DEBUG/INFO dump full request bodies (prompts) to stdout and OVERRIDE
      # the config's set_verbose/turn_off_message_logging. Keep at ERROR so no
      # prompt/response content is written to local logs (logs are in-scope for
      # ZDR/HIPAA). Was DEBUG for a past Groq tool-call investigation.
      LITELLM_LOG: ERROR
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      # Tool-call repair callback. Catches Groq's `tool_use_failed` string
      # error code so LiteLLM's int-parse doesn't crash on it, and rewrites
      # malformed tool calls from weak models into proper tool_calls[] arrays.
      # Referenced from config.yaml as `tool_repair.tool_repair_handler`.
      - ./litellm/tool_repair.py:/app/tool_repair.py:ro
      # AWS shared-credentials file (read-only). Required for Bedrock routes —
      # boto3's default credential chain reads this when AWS_ACCESS_KEY_ID env
      # isn't set. Keeps credentials out of .env / docker-compose / git.
      - ${HOME}/.aws:/root/.aws:ro
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
      - --host
      - "0.0.0.0"
    # Healthcheck so `docker compose ps` shows real readiness and downstream
    # automation can wait on `condition: service_healthy` instead of sleeping.
    # /health/readiness is LiteLLM's lightweight unauth probe.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=2).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
