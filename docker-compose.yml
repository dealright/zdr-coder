# zdr-coder local stack — just LiteLLM. No mesh VPN; the GPU pod is reached via
# RunPod's HTTPS proxy at https://[POD_ID]-8000.proxy.runpod.net (auth via
# bearer token set per-profile in .env-runtime).

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: zdr-litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env-runtime
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
      - --host
      - "0.0.0.0"
