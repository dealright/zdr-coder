# zdr-coder local stack — just LiteLLM. No mesh VPN; the GPU pod is reached via
# RunPod's HTTPS proxy at https://[POD_ID]-8000.proxy.runpod.net (auth via
# bearer token set per-profile in .env-runtime).

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: zdr-litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    # Per-profile API_BASE/_KEY vars + LITELLM_MASTER_KEY come from .env-runtime
    # (written by deploy scripts). Provider API keys like GROQ_API_KEY come
    # from .env directly (no deploy step — keys persist for the lifetime of
    # the account). Compose merges both; .env-runtime wins on conflict.
    env_file:
      - path: .env
        required: false
      - path: .env-runtime
        required: false
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
      - --host
      - "0.0.0.0"
